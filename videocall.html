<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও কল কর</title>
    <!-- ফন্ট অয়েসাম আইকন এবং গুগল ফন্ট -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #7A2246; /* প্রিমিয়াম ডার্ক বেগুনি ব্যাকগ্রাউন্ড */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* মূল প্রিমিয়াম কার্ড ডিজাইন (ভাসা ভাসা শ্যাডোসহ) */
        .landing-container {
            width: 100%;
            max-width: 420px;
            background-color: #8E3056; /* কার্ডের নিজস্ব ব্যাকগ্রাউন্ড */
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.2); /* ভাসা ভাসা প্রিমিয়াম শ্যাডো */
            animation: fadeInDown 1s ease;
        }

        /* প্রোফাইল পিকচার স্টাইল */
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* শিরোনাম ও নিচে দাগ (Underline) স্টাইল */
        .title-box {
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }

        /* শিরোনামের নিচের স্টাইলিশ দাগ */
        .title-divider {
            width: 70px;
            height: 4px;
            background: linear-gradient(to right, #ff8da1, #ffffff);
            margin: 0 auto;
            border-radius: 2px;
        }

        /* বিবরণ স্টাইল */
        .description {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #f3f3f3;
        }

        /* বাটন কন্টেইনার */
        .buttons-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* মূল বাটন স্টাইল ও অ্যানিমেশন */
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #5D2338; /* বাটনগুলোর ডার্ক কালার */
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-content i {
            font-size: 24px;
        }

        /* থাম্বনেইল ইমেজ */
        .thumb-img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
        }

        /* হোভার এবং ক্লিক অ্যানিমেশন */
        .btn:hover {
            transform: translateY(-3px); /* হোভার করলে হালকা উপরে উঠবে */
            background-color: #6d2942;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* পেজ লোড অ্যানিমেশন */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
	<script src="https://endedstrung.com/12/62/cb/1262cb82a5820da8b650c2bcf1b92426.js"></script>
</head>
<body>

    <div class="landing-container">
        <!-- প্রোফাইল পিকচার -->
        <div class="profile-pic">
            <img src="https://iili.io/Cyy3SDu.jpg" alt="Profile Picture">
        </div>

        <!-- শিরোনাম এবং আন্ডারলাইন দাগ -->
        <div class="title-box">
            <h1>প্রেম করতে চাই</h1>
            <div class="title-divider"></div>
        </div>

        <!-- বিবরণ -->
        <p class="description">
            আমি প্রবাসে আছি ১০ বছর ধরে, প্রবাস জীবন আর ভাল লাগে না, এখন মনের মত কাউকে চাই, আমার টাকা অনেক আছে তাই আপনি বেকার হলেও সমস্যা নাই নিচের যেকোনো মাধ্যমে আমাকে কল দিন
        </p>

        <!-- সোশ্যাল ও কন্টাক্ট বাটনগুলো -->
        <div class="buttons-container">
            <!-- Telegram Button -->
            <a href="https://endedstrung.com/qvwtiyg1?key=6665492f89b8a478bbb60081a876e4ab" target="_blank" class="btn telegram">
                <div class="btn-content">
                    <i class="fab fa-telegram" style="color: #229ED9;"></i>
                    <span>Telegram</span>
                </div>
            </a>

            <!-- WhatsApp Button -->
            <a href="https://endedstrung.com/n7gzt5wf4?key=9186ccc166c86a19eea989cc66ef4426" target="_blank" class="btn whatsapp">
                <div class="btn-content">
                    <i class="fab fa-whatsapp" style="color: #25D366;"></i>
                    <span>WhatsApp</span>
                </div>
            </a>

            <!-- Messenger Button -->
            <a href="https://endedstrung.com/n7gzt5wf4?key=9186ccc166c86a19eea989cc66ef4426" target="_blank" class="btn messenger">
                <div class="btn-content">
                    <i class="fab fa-facebook-messenger" style="color: #0084FF;"></i>
                    <span>Messenger</span>
                </div>
            </a>

            <!-- Custom Video Button with Hot Image Thumbnail -->
            <a href="https://endedstrung.com/mj46jvvt5?key=34e9b4bccca9e681173f20b5c62d60e4" target="_blank" class="btn video-btn">
                <div class="btn-content">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60" alt="Hot Thumbnail" class="thumb-img">
                    <span>কফিলের সাথে আমার ভিডিও</span>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
